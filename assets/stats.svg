<svg width="840" height="318" viewBox="0 0 840 318"
  xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub statistics">
  
    <style>
      :root { 
    --bg:#ffffff; --bg-elev:#f6f8fa; --border:#d8dee4;
    --text:#1f2328; --muted:#59636e;
    --accent:#0d9488; --accent-2:#4f46e5; }
      @media (prefers-color-scheme: dark) { :root { 
    --bg:#0a0e14; --bg-elev:#111722; --border:#1f2733;
    --text:#e6edf3; --muted:#8b98a9;
    --accent:#4fd1c5; --accent-2:#7c93f0; } }
      .bg { fill: var(--bg); }
      .elev { fill: var(--bg-elev); stroke: var(--border); }
      .text { fill: var(--text); }
      .muted { fill: var(--muted); }
      .accent { fill: var(--accent); }
      .accent-2 { fill: var(--accent-2); }
      .stroke-accent { stroke: var(--accent); }
      .stroke-border { stroke: var(--border); }
    </style>
  <rect class="bg" x="0.5" y="0.5" width="839" height="317" rx="10"/>
  <rect class="stroke-border" x="0.5" y="0.5" width="839" height="317"
    rx="10" fill="none" stroke-width="1"/>
  
      <text x="105" y="50" class="accent" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace" font-size="30" font-weight="700">65</text>
      <text x="105" y="74" class="muted" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">Repositorios</text>
      <text x="315" y="50" class="accent" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace" font-size="30" font-weight="700">3</text>
      <text x="315" y="74" class="muted" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">Stars</text>
      <text x="525" y="50" class="accent" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace" font-size="30" font-weight="700">0</text>
      <text x="525" y="74" class="muted" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">Seguidores</text>
      <text x="735" y="50" class="accent" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace" font-size="30" font-weight="700">375</text>
      <text x="735" y="74" class="muted" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">Contribuciones</text>
  <line x1="40" y1="96" x2="800" y2="96" class="stroke-border" stroke-width="1"/>
  
      <text x="40" y="125" class="text" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace"
        font-size="13">Python</text>
      <rect x="160" y="114" width="620" height="13" rx="6"
