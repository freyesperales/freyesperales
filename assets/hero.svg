<svg width="840" height="200" viewBox="0 0 840 200"
  xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Francisco Reyes — software engineering profile header">
  
    <style>
      :root { 
    --bg:#ffffff; --bg-elev:#f6f8fa; --border:#d8dee4;
    --text:#1f2328; --muted:#59636e;
    --accent:#0d9488; --accent-2:#4f46e5; }
      @media (prefers-color-scheme: dark) { :root { 
    --bg:#0a0e14; --bg-elev:#111722; --border:#1f2733;
    --text:#e6edf3; --muted:#8b98a9;
    --accent:#4fd1c5; --accent-2:#7c93f0; } }
      .bg { fill: var(--bg); }
      .elev { fill: var(--bg-elev); stroke: var(--border); }
      .text { fill: var(--text); }
      .muted { fill: var(--muted); }
      .accent { fill: var(--accent); }
      .accent-2 { fill: var(--accent-2); }
      .stroke-accent { stroke: var(--accent); }
      .stroke-border { stroke: var(--border); }
    </style>
  <defs>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="var(--accent)" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="var(--accent-2)" stop-opacity="0.0"/>
      <animate attributeName="x1" values="-100%;100%" dur="6s"
        repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="x2" values="0%;200%" dur="6s"
        repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="838" height="198" rx="10"/></clipPath>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="839" height="199" rx="10"/>
  <rect class="stroke-border" x="0.5" y="0.5" width="839" height="199"
    rx="10" fill="none" stroke-width="1"/>

  <!-- animated gradient sweep, clipped to the card -->
  <g clip-path="url(#card)">
    <rect x="0" y="0" width="840" height="200" fill="url(#sweep)"/>
