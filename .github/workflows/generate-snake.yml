name: Generate Snake

on:
  schedule:
    # Twice a day. Cron is best-effort on GitHub; exact minute may drift.
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

# Least privilege: the job only needs to write repo contents (the output branch).
permissions:
  contents: write

concurrency:
  group: generate-snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs into ./dist
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=#4fd1c5&color_dots=#1f2733,#2c6e6a,#3a9d96,#47ccc2,#4fd1c5

      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh snake animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
